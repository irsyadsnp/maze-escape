
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maze Escape 2.0</title>

<style>
:root {
  --bg: #101820;
  --panel: #1b2a35;
  --wall: #344e60;
  --floor: #e8e3d5;
  --green: #4ade80;
  --gold: #facc15;
  --red: #fb7185;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: var(--bg);
  color: white;
  font-family: monospace;
}

.container {
  width: 100%;
  max-width: 540px;
  text-align: center;
}

h1 {
  color: var(--gold);
  letter-spacing: 3px;
  font-size: 30px;
  margin-bottom: 5px;
}

.subtitle {
  color: #9ca3af;
  margin-bottom: 18px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  margin-bottom: 12px;
}

.stat {
  background: var(--panel);
  border-radius: 8px;
  padding: 10px 3px;
}

.stat-label {
  font-size: 10px;
  color: #9ca3af;
}

.stat-value {
  font-size: 18px;
  margin-top: 6px;
  color: var(--gold);
}

.game-wrapper {
  background: var(--panel);
  padding: 10px;
  border-radius: 12px;
}

canvas {
  width: 100%;
  height: auto;
  display: block;
  image-rendering: pixelated;
  border-radius: 5px;
}

.message {
  min-height: 42px;
  margin: 12px 0;
  color: var(--green);
  font-size: 13px;
  line-height: 1.5;
}

.controls {
  display: grid;
  grid-template-columns: repeat(3, 58px);
  grid-template-rows: repeat(2, 48px);
  gap: 7px;
  justify-content: center;
  margin: 14px auto;
}

.control-btn {
  border: 0;
  border-radius: 8px;
  background: #344e60;
  color: white;
  font-size: 21px;
  touch-action: manipulation;
  cursor: pointer;
}

.control-btn:active {
  background: var(--green);
  color: #101820;
}

.up { grid-column: 2; }
.left { grid-column: 1; grid-row: 2; }
.down { grid-column: 2; grid-row: 2; }
.right { grid-column: 3; grid-row: 2; }

.actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
}

.action-btn {
  border: 0;
  border-radius: 7px;
  padding: 11px 14px;
  font-family: monospace;
  font-weight: bold;
  cursor: pointer;
}

.restart {
  background: var(--gold);
  color: #101820;
}

.hint {
  background: #344e60;
  color: white;
}

.sound {
  background: #475569;
  color: white;
}

.legend {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 13px;
  color: #9ca3af;
  font-size: 11px;
  margin-top: 17px;
}

.instructions {
  color: #9ca3af;
  font-size: 11px;
  line-height: 1.7;
  margin-top: 15px;
}

@media (max-width: 400px) {
  body { padding: 10px; }
  h1 { font-size: 25px; }
  .stat-value { font-size: 15px; }
}
</style>
</head>

<body>
<div class="container">

  <h1>MAZE ESCAPE 2.0</h1>
  <div class="subtitle">Collect. Survive. Escape.</div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">LEVEL</div>
      <div class="stat-value" id="level">1/3</div>
    </div>
    <div class="stat">
      <div class="stat-label">SCORE</div>
      <div class="stat-value" id="score">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">COINS</div>
      <div class="stat-value" id="coins">0/0</div>
    </div>
    <div class="stat">
      <div class="stat-label">LIVES</div>
      <div class="stat-value" id="lives">♥♥♥</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">TIME</div>
      <div class="stat-value" id="time">00:00</div>
    </div>
    <div class="stat">
      <div class="stat-label">STEPS</div>
      <div class="stat-value" id="steps">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">STATUS</div>
      <div class="stat-value" id="status">PLAY</div>
    </div>
    <div class="stat">
      <div class="stat-label">BEST</div>
      <div class="stat-value" id="best">0</div>
    </div>
  </div>

  <div class="game-wrapper">
    <canvas id="game" width="480" height="480"></canvas>
  </div>

  <div class="message" id="message">
    Collect all coins and find the exit!
  </div>

  <div class="controls">
    <button class="control-btn up" data-dir="up">▲</button>
    <button class="control-btn left" data-dir="left">◀</button>
    <button class="control-btn down" data-dir="down">▼</button>
    <button class="control-btn right" data-dir="right">▶</button>
  </div>

  <div class="actions">
    <button class="action-btn restart" id="restart">↻ RESTART</button>
    <button class="action-btn hint" id="hint">✦ HINT</button>
    <button class="action-btn sound" id="sound">♫ SOUND ON</button>
  </div>

  <div class="legend">
    <span>🟩 YOU</span>
    <span>🟥 ENEMY</span>
    <span>🟡 COIN</span>
    <span>🚪 EXIT</span>
  </div>

  <div class="instructions">
    KEYBOARD: WASD / ARROW KEYS<br>
    MOBILE: USE THE DIRECTION BUTTONS<br>
    Collect every coin before reaching the exit.
  </div>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const $ = id => document.getElementById(id);

const LEVELS = [
  { size: 15, coinCount: 5 },
  { size: 19, coinCount: 8 },
  { size: 23, coinCount: 12 }
];

let level = 0;
let maze = [];
let size = 15;
let cell = 32;

let player = { x: 1, y: 1 };
let enemy = { x: 1, y: 1 };
let exit = { x: 13, y: 13 };

let coins = [];
let hintPath = [];

let score = 0;
let steps = 0;
let lives = 3;
let collected = 0;

let started = false;
let finished = false;
let gameOver = false;

let startTime = 0;
let elapsed = 0;
let timer = null;
let enemyCounter = 0;

let soundOn = true;
let audioContext = null;

let best = Number(localStorage.getItem("mazeBest") || 0);
$("best").textContent = best;

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function generateMaze(n) {
  const grid = Array.from(
    { length: n },
    () => Array(n).fill(1)
  );

  const stack = [{ x: 1, y: 1 }];
  grid[1][1] = 0;

  while (stack.length) {
    const current = stack[stack.length - 1];

    const directions = shuffle([
      { x: 0, y: -2 },
      { x: 0, y: 2 },
      { x: -2, y: 0 },
      { x: 2, y: 0 }
    ]);

    let found = false;

    for (const d of directions) {
      const nx = current.x + d.x;
      const ny = current.y + d.y;

      if (
        nx > 0 && nx < n - 1 &&
        ny > 0 && ny < n - 1 &&
        grid[ny][nx] === 1
      ) {
        grid[current.y + d.y / 2][current.x + d.x / 2] = 0;
        grid[ny][nx] = 0;

        stack.push({ x: nx, y: ny });
        found = true;
        break;
      }
    }

    if (!found) stack.pop();
  }

  return grid;
}

function isWall(x, y) {
  return (
    x < 0 || y < 0 ||
    x >= size || y >= size ||
    maze[y][x] === 1
  );
}

function randomFloor(excluded = []) {
  const available = [];

  for (let y = 1; y < size - 1; y++) {
    for (let x = 1; x < size - 1; x++) {
      if (maze[y][x] !== 0) continue;

      const blocked = excluded.some(
        p => p.x === x && p.y === y
      );

      if (!blocked) available.push({ x, y });
    }
  }

  return available[Math.floor(Math.random() * available.length)];
}

function createLevel() {
  const config = LEVELS[level];

  size = config.size;
  cell = 480 / size;

  maze = generateMaze(size);

  player = { x: 1, y: 1 };
  exit = { x: size - 2, y: size - 2 };

  maze[exit.y][exit.x] = 0;

  coins = [];
  collected = 0;
  hintPath = [];
  enemyCounter = 0;

  const excluded = [
    player,
    exit,
    { x: 1, y: 2 },
    { x: 2, y: 1 }
  ];

  for (let i = 0; i < config.coinCount; i++) {
    const coin = randomFloor(excluded);
    if (!coin) break;

    coins.push(coin);
    excluded.push(coin);
  }

  enemy = randomFloor(excluded);

  steps = 0;
  started = false;
  finished = false;
  gameOver = false;

  clearInterval(timer);

  $("level").textContent = `${level + 1}/3`;
  $("coins").textContent = `0/${coins.length}`;
  $("steps").textContent = "0";
  $("status").textContent = "PLAY";
  $("message").textContent =
    `Level ${level + 1}: collect all coins and escape!`;

  draw();
  updateStats();
}

function updateStats() {
  $("score").textContent = score;
  $("lives").textContent = "♥".repeat(lives) + "♡".repeat(3 - lives);
  $("steps").textContent = steps;
  $("coins").textContent = `${collected}/${coins.length}`;
}

function updateTimer() {
  if (!started || finished || gameOver) return;

  elapsed = Math.floor((Date.now() - startTime) / 1000);

  const min = String(Math.floor(elapsed / 60)).padStart(2, "0");
  const sec = String(elapsed % 60).padStart(2, "0");

  $("time").textContent = `${min}:${sec}`;
}

function playSound(frequency = 440, duration = 0.08) {
  if (!soundOn) return;

  try {
    audioContext ||= new (
      window.AudioContext || window.webkitAudioContext
    )();

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.frequency.value = frequency;
    oscillator.type = "square";

    gain.gain.setValueAtTime(0.07, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + duration);
  } catch (error) {
    // Audio is optional.
  }
}

function draw() {
  ctx.clearRect(0, 0, 480, 480);

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const px = x * cell;
      const py = y * cell;

      if (maze[y][x] === 1) {
        ctx.fillStyle = "#344e60";
        ctx.fillRect(px, py, cell, cell);

        ctx.fillStyle = "#405d70";
        ctx.fillRect(
          px + cell * 0.12,
          py + cell * 0.12,
          cell * 0.76,
          cell * 0.76
        );
      } else {
        ctx.fillStyle = "#e8e3d5";
        ctx.fillRect(px, py, cell, cell);
      }

      ctx.strokeStyle = "rgba(0,0,0,0.08)";
      ctx.strokeRect(px, py, cell, cell);
    }
  }

  // Hint path
  ctx.fillStyle = "rgba(59,130,246,0.5)";

  hintPath.forEach(p => {
    ctx.fillRect(
      p.x * cell + cell * 0.3,
      p.y * cell + cell * 0.3,
      cell * 0.4,
      cell * 0.4
    );
  });

  // Coins
  coins.forEach(coin => {
    ctx.fillStyle = "#facc15";
    ctx.beginPath();
    ctx.arc(
      (coin.x + 0.5) * cell,
      (coin.y + 0.5) * cell,
      cell * 0.23,
      0,
      Math.PI * 2
    );
    ctx.fill();

    ctx.fillStyle = "#fff4a3";
    ctx.beginPath();
    ctx.arc(
      (coin.x + 0.42) * cell,
      (coin.y + 0.4) * cell,
      cell * 0.07,
      0,
      Math.PI * 2
    );
    ctx.fill();
  });

  // Exit
  ctx.fillStyle = "#a16207";
  ctx.fillRect(
    exit.x * cell + cell * 0.15,
    exit.y * cell + cell * 0.15,
    cell * 0.7,
    cell * 0.7
  );

  ctx.fillStyle = "#facc15";
  ctx.fillRect(
    exit.x * cell + cell * 0.23,
    exit.y * cell + cell * 0.23,
    cell * 0.54,
    cell * 0.54
  );

  // Enemy
  ctx.fillStyle = "#be123c";
  ctx.fillRect(
    enemy.x * cell + cell * 0.17,
    enemy.y * cell + cell * 0.17,
    cell * 0.66,
    cell * 0.66
  );

  ctx.fillStyle = "white";
  ctx.fillRect(
    enemy.x * cell + cell * 0.28,
    enemy.y * cell + cell * 0.32,
    cell * 0.13,
    cell * 0.13
  );

  ctx.fillRect(
    enemy.x * cell + cell * 0.58,
    enemy.y * cell + cell * 0.32,
    cell * 0.13,
    cell * 0.13
  );

  // Player
  ctx.fillStyle = "#15803d";
  ctx.fillRect(
    player.x * cell + cell * 0.12,
    player.y * cell + cell * 0.12,
    cell * 0.76,
    cell * 0.76
  );

  ctx.fillStyle = "#4ade80";
  ctx.fillRect(
    player.x * cell + cell * 0.24,
    player.y * cell + cell * 0.24,
    cell * 0.52,
    cell * 0.52
  );

  ctx.fillStyle = "#101820";
  ctx.fillRect(
    player.x * cell + cell * 0.34,
    player.y * cell + cell * 0.35,
    cell * 0.09,
    cell * 0.09
  );

  ctx.fillRect(
    player.x * cell + cell * 0.58,
    player.y * cell + cell * 0.35,
    cell * 0.09,
    cell * 0.09
  );
}

function startGameTimer() {
  if (started) return;

  started = true;
  startTime = Date.now();

  timer = setInterval(updateTimer, 250);
}

function move(dx, dy) {
  if (finished || gameOver) return;

  const nx = player.x + dx;
  const ny = player.y + dy;

  if (isWall(nx, ny)) {
    playSound(130, 0.05);
    return;
  }

  startGameTimer();

  player = { x: nx, y: ny };
  steps++;
  enemyCounter++;

  hintPath = [];

  const coinIndex = coins.findIndex(
    c => c.x === player.x && c.y === player.y
  );

  if (coinIndex !== -1) {
    coins.splice(coinIndex, 1);
    collected++;
    score += 100;
    playSound(700, 0.1);

    $("message").textContent = "Coin collected! +100 points";
  }

  if (enemyCounter >= 3) {
    enemyCounter = 0;
    moveEnemy();
  }

  if (player.x === enemy.x && player.y === enemy.y) {
    hitEnemy();
  }

  if (
    player.x === exit.x &&
    player.y === exit.y
  ) {
    if (coins.length === 0) {
      completeLevel();
      return;
    }

    $("message").textContent =
      `You still need ${coins.length} more coin(s)!`;
  }

  updateStats();
  draw();
}

function moveEnemy() {
  const directions = shuffle([
    { x: 0, y: -1 },
    { x: 0, y: 1 },
    { x: -1, y: 0 },
    { x: 1, y: 0 }
  ]);

  const options = directions
    .map(d => ({ x: enemy.x + d.x, y: enemy.y + d.y }))
    .filter(p => !isWall(p.x, p.y));

  if (options.length) {
    enemy = options[0];
  }

  if (player.x === enemy.x && player.y === enemy.y) {
    hitEnemy();
  }
}

function hitEnemy() {
  lives--;
  playSound(150, 0.25);

  if (lives <= 0) {
    endGame();
    return;
  }

  player = { x: 1, y: 1 };
  enemy = randomFloor([player, exit, ...coins]);

  $("message").textContent =
    `The enemy caught you! ${lives} life(s) remaining.`;

  updateStats();
  draw();
}

function completeLevel() {
  finished = true;
  clearInterval(timer);
  updateTimer();

  score += Math.max(0, 500 - elapsed * 3);
  playSound(850, 0.25);

  if (level < LEVELS.length - 1) {
    $("status").textContent = "CLEAR";
    $("message").textContent =
      `Level ${level + 1} complete! Preparing next level...`;

    updateStats();

    setTimeout(() => {
      level++;
      createLevel();
    }, 1200);
  } else {
    winGame();
  }
}

function winGame() {
  finished = true;
  clearInterval(timer);

  score += lives * 200;

  $("status").textContent = "WIN";
  $("message").textContent =
    `YOU ESCAPED! Final score: ${score}`;

  if (score > best) {
    best = score;
    localStorage.setItem("mazeBest", best);
    $("best").textContent = best;
  }

  updateStats();
  draw();
}

function endGame() {
  gameOver = true;
  finished = true;

  clearInterval(timer);

  $("status").textContent = "LOST";
  $("message").textContent =
    `GAME OVER! Final score: ${score}. Press Restart to try again.`;

  updateStats();
  draw();
}

function findPath() {
  const queue = [{
    x: player.x,
    y: player.y,
    path: []
  }];

  const visited = new Set();
  const directions = [
    { x: 0, y: -1 },
    { x: 0, y: 1 },
    { x: -1, y: 0 },
    { x: 1, y: 0 }
  ];

  while (queue.length) {
    const current = queue.shift();
    const key = `${current.x},${current.y}`;

    if (visited.has(key)) continue;
    visited.add(key);

    if (current.x === exit.x && current.y === exit.y) {
      return current.path;
    }

    for (const d of directions) {
      const nx = current.x + d.x;
      const ny = current.y + d.y;

      if (!isWall(nx, ny) && !visited.has(`${nx},${ny}`)) {
        queue.push({
          x: nx,
          y: ny,
          path: [...current.path, { x: nx, y: ny }]
        });
      }
    }
  }

  return [];
}

function showHint() {
  if (finished) return;

  hintPath = findPath();

  draw();

  $("message").textContent =
    "Blue squares show the shortest route to the exit.";
}

function restartGame() {
  clearInterval(timer);

  level = 0;
  score = 0;
  steps = 0;
  lives = 3;
  elapsed = 0;

  $("time").textContent = "00:00";

  createLevel();
}

document.addEventListener("keydown", event => {
  const keys = {
    ArrowUp: [0, -1],
    w: [0, -1],
    W: [0, -1],
    ArrowDown: [0, 1],
    s: [0, 1],
    S: [0, 1],
    ArrowLeft: [-1, 0],
    a: [-1, 0],
    A: [-1, 0],
    ArrowRight: [1, 0],
    d: [1, 0],
    D: [1, 0]
  };

  if (keys[event.key]) {
    event.preventDefault();
    move(...keys[event.key]);
  }
});

document.querySelectorAll(".control-btn").forEach(button => {
  button.addEventListener("click", () => {
    const dirs = {
      up: [0, -1],
      down: [0, 1],
      left: [-1, 0],
      right: [1, 0]
    };

    move(...dirs[button.dataset.dir]);
  });
});

$("restart").addEventListener("click", restartGame);
$("hint").addEventListener("click", showHint);

$("sound").addEventListener("click", () => {
  soundOn = !soundOn;
  $("sound").textContent = soundOn ? "♫ SOUND ON" : "♫ SOUND OFF";

  if (soundOn) playSound(500, 0.1);
});

createLevel();
</script>
</body>
</html>
